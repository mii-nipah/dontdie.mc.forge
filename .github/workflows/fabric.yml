name: Fabric

on:
  pull_request:
    paths:
      - 'fabric/**'
      - 'fabric-*/**'
      - 'forge-*/**'
      - 'neoforge-*/**'
      - 'common/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - 'LICENSE'
      - '.github/workflows/fabric.yml'
  push:
    branches: [main]
    paths:
      - 'fabric/**'
      - 'fabric-*/**'
      - 'forge-*/**'
      - 'neoforge-*/**'
      - 'common/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - 'LICENSE'
      - '.github/workflows/fabric.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Build all targets
        run: bash ./gradlew build --no-daemon
      - name: Check dedicated-server initialization without accepting the EULA
        shell: bash
        run: |
          for target in fabric-1.20.1 fabric-1.21.1; do
            mkdir -p "$target/run"
            printf 'eula=false\n' > "$target/run/eula.txt"
            timeout 180 bash ./gradlew ":$target:runServer" --no-daemon --args=nogui 2>&1 | tee "$target-loader.log"
            grep -F 'You need to agree to the EULA' "$target-loader.log"
            grep -Fx 'eula=false' "$target/run/eula.txt"
            if grep -E 'Could not execute entrypoint|Failed to launch|Incompatible mods found|Mixin apply failed|NoClassDefFoundError|ClassNotFoundException' "$target-loader.log"; then
              exit 1
            fi
          done
