plugins {
    id 'base'
    id 'fabric-loom' version '1.7.4' apply false
}

defaultTasks 'build'

tasks.named('build') {
    dependsOn subprojects.collect { "${it.path}:build" }
}

tasks.named('clean') {
    dependsOn subprojects.collect { "${it.path}:clean" }
}

subprojects {
    group = mod_group_id
    version = mod_version

    plugins.withType(JavaPlugin) {
        base.archivesName = "${mod_id}-${project.name}"
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
            withSourcesJar()
        }
        // Compile shared sources in each loader's mapping namespace and package them in its jar.
        sourceSets.main {
            java.srcDir rootProject.file('common/src/main/java')
            resources.srcDir rootProject.file('common/src/main/resources')
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = java_version.toInteger()
        }
        tasks.named('processResources', ProcessResources) {
            def metadata = ['mod_id', 'mod_name', 'mod_version', 'mod_license', 'mod_authors',
                            'mod_description', 'minecraft_version', 'minecraft_version_range',
                            'loader_version', 'loader_version_range', 'platform_version_range',
                            'java_version'].findAll { project.hasProperty(it) }
                                           .collectEntries { [(it): project.property(it)] }
            inputs.properties metadata
            filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
                expand metadata
            }
        }
        tasks.named('jar', Jar) {
            from rootProject.file('LICENSE')
        }
    }
}

configure(subprojects.findAll { it.name.startsWith('fabric-') }) {
    apply plugin: 'fabric-loom'
    apply from: rootProject.file('gradle/fabric.gradle')
}
